server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server — resolves the "backend" hostname below lazily, per
    # request, instead of once at config load. A static (non-variable) proxy_pass target
    # makes nginx refuse to even start if that hostname isn't resolvable yet (e.g. the
    # backend container isn't up), which would take the whole frontend down with it.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated per container start (docker-entrypoint.d/40-cdrm-config.sh) — must never
    # be cached like the content-hashed bundle files below, or a config change wouldn't
    # reach browsers that already loaded it. Exact-match location, so it wins over the
    # regex below.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # "backend" must resolve to the actual backend host/service name in whatever
    # orchestration runs this container (docker-compose service name, k8s Service, etc.) —
    # adjust once that topology exists.
    # proxy_pass with a variable never rewrites the path like a static target would (a
    # variable target plus a URI part, e.g. "http://$backend/;", replaces the whole
    # request path with exactly that URI) — so the /api prefix is stripped by the
    # rewrite, and proxy_pass gets no URI part and forwards the rewritten path as-is.
    location /api/ {
        set $backend "backend:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live UI updates (see README's "Live UI Updates (WebSocket)") — needs the actual
    # Upgrade/Connection headers (proxy_set_header Host/X-Forwarded-* above don't imply
    # these) and a long read timeout, since a WebSocket connection is meant to stay open
    # far longer than nginx's default proxy_read_timeout would otherwise allow.
    location /ws {
        set $backend "backend:8080";
        # No URI part — forwards the original path and query (see /api/ above).
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
