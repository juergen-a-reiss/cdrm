server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server — resolves the "backend" hostname below lazily, per
    # request, instead of once at config load. A static (non-variable) proxy_pass target
    # makes nginx refuse to even start if that hostname isn't resolvable yet (e.g. the
    # backend container isn't up), which would take the whole frontend down with it.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # "backend" must resolve to the actual backend host/service name in whatever
    # orchestration runs this container (docker-compose service name, k8s Service, etc.) —
    # adjust once that topology exists.
    location /api/ {
        set $backend "backend:8080";
        proxy_pass http://$backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
