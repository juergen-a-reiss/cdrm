---
# Creates the namespaces cdrm's local dev setup deploys into. All four cdrm stages
# (development/qa/staging/production) share this single minikube cluster, so each
# stage's namespace_prefix (see ../../seed/data.yaml) keeps them from colliding —
# a workload with kubernetesNameSpace "platform" ends up as "dev-platform" in the
# development stage, "qa-platform" in qa, etc. This list must stay in sync with
# ../../seed/data.yaml's stage namespace_prefix values and workloads' kubernetes_namespace
# values.
- name: Configure minikube namespaces for cdrm local development
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_context: minikube
    namespaces:
      - dev-platform
      - dev-website
      - qa-platform
      - qa-website
      - staging-platform
      - staging-website
      - prod-platform
      - prod-website

  tasks:
    - name: Create namespaces
      kubernetes.core.k8s:
        context: "{{ kubeconfig_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ namespaces }}"
