---
# Keycloak Admin REST API: https://www.keycloak.org/docs-api/latest/rest-api/
- name: Configure Keycloak CDRM realm
  hosts: localhost
  gather_facts: false
  vars:
    keycloak_url: "http://keycloak:8080" # The internal port is 8080.
    keycloak_admin_user: "admin"
    keycloak_admin_password: "admin"
    realm_name: "cdrm"
    realm_display_name: "Continuous Delivery Release Management"
    frontend_url: "http://localhost:5173"
    # 8h access tokens — manual testing convenience only, do not use in production.
    access_token_lifespan_seconds: 28800
    client_name: "cdrm"
    test_user_password: "test"
    client_roles:
      - cdrm-devops
      - cdrm-developer
      - cdrm-productowner
      - cdrm-manager
    user_names:
      cdrm-devops:
        firstName: John
        lastName: Doe
      cdrm-developer:
        firstName: Mr.
        lastName: Code
      cdrm-productowner:
        firstName: Product
        lastName: Owner
      cdrm-manager:
        firstName: The
        lastName: Manager
    # ReBAC (see README): custom user attributes cdrm mirrors into JWT claims of the
    # same name via a protocol mapper per attribute, each a multivalued string claim
    # (Keycloak attributes are natively Map<String, List<String>>, matching the "list
    # of ..." shape every one of these attributes documents).
    rebac_attributes:
      - cdrm-products
      - cdrm-workloads
      - cdrm-release-actions
    # Keycloak's realm "User profile" (Realm settings -> User profile tab) only lets an
    # attribute persist and appear in the admin console if it's declared here first —
    # an attribute set via the Admin REST API but absent from this list is silently
    # dropped (unless "unmanaged attributes" is enabled realm-wide, which this avoids).
    # edit: [admin] (not "user") since these are access-control data, not something a
    # user should be able to self-service edit.
    rebac_attribute_group: rebac
    rebac_attribute_definitions:
      - name: cdrm-products
        displayName: "ReBAC: Products"
        group: "{{ rebac_attribute_group }}"
        multivalued: true
        permissions:
          view: [admin, user]
          edit: [admin]
        validations: {}
      - name: cdrm-workloads
        displayName: "ReBAC: Workloads"
        group: "{{ rebac_attribute_group }}"
        multivalued: true
        permissions:
          view: [admin, user]
          edit: [admin]
        validations: {}
      - name: cdrm-release-actions
        displayName: "ReBAC: Release Actions"
        group: "{{ rebac_attribute_group }}"
        multivalued: true
        permissions:
          view: [admin, user]
          edit: [admin]
        validations: {}
    rebac_attribute_group_definition:
      name: "{{ rebac_attribute_group }}"
      displayHeader: "ReBAC"
      displayDescription: "Relationship-based access control attributes cdrm reads from the JWT (see README)"
    # One restricted-to-a-single-value pair per attribute, on the role that owns that
    # resource conceptually (product owners restricted by product, developers by
    # workload, managers by which release actions/stages they can use) — enough to
    # demonstrate each attribute in isolation without combining restrictions on one user.
    rebac_demo_users:
      - username: cdrm-productowner-platform
        role: cdrm-productowner
        firstName: Product
        lastName: Owner - Platform
        attributes:
          cdrm-products: ["Platform"]
      - username: cdrm-productowner-platform-early
        role: cdrm-productowner
        firstName: Product
        lastName: Owner - Platform
        attributes:
          cdrm-products: ["Platform"]
          cdrm-release-actions: ["promote: development, qa"]
      - username: cdrm-productowner-platform-late
        role: cdrm-productowner
        firstName: Product
        lastName: Owner - Platform
        attributes:
          cdrm-products: ["Platform"]
          cdrm-release-actions: ["promote: staging, production"]
      - username: cdrm-productowner-payments
        role: cdrm-productowner
        firstName: Product
        lastName: Owner - Payments
        attributes:
          cdrm-products: ["Payments"]
      - username: cdrm-developer-platform-api
        role: cdrm-developer
        firstName: Mr.
        lastName: Code - platform-api
        attributes:
          cdrm-workloads: ["platform-api"]
      - username: cdrm-developer-payments-gateway
        role: cdrm-developer
        firstName: Mr.
        lastName: Code - payments-gateway
        attributes:
          cdrm-workloads: ["payments-gateway"]
      - username: cdrm-manager-platform
        role: cdrm-manager
        firstName: The
        lastName: Manager - dev and qa
        attributes:
          cdrm-products: ["Platform"]
      - username: cdrm-manager-payments
        role: cdrm-manager
        firstName: The
        lastName: Manager - all stages
        attributes:
          cdrm-products: ["Payments"]

  tasks:
    - name: Obtain admin access token
      uri:
        url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          username: "{{ keycloak_admin_user }}"
          password: "{{ keycloak_admin_password }}"
          grant_type: password
        status_code: 200
      register: auth

    - name: Create realm '{{ realm_name }}'
      uri:
        url: "{{ keycloak_url }}/admin/realms"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          realm: "{{ realm_name }}"
          enabled: true
          displayName: "{{ realm_display_name }}"
        status_code: [201, 409]

    - name: Configure realm '{{ realm_name }}'
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          realm: "{{ realm_name }}"
          accessTokenLifespan: "{{ access_token_lifespan_seconds }}"
        status_code: 204

    - name: Fetch current realm user profile configuration
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/profile"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: user_profile

    - name: Declare ReBAC attributes in the realm's user profile
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/profile"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          # Drop-then-append instead of a plain append, so re-running with a changed
          # definition converges instead of leaving the old one in place.
          attributes: >-
            {{
              (user_profile.json.attributes | rejectattr('name', 'in', rebac_attributes) | list)
              + rebac_attribute_definitions
            }}
          groups: >-
            {{
              (user_profile.json.groups | rejectattr('name', 'equalto', rebac_attribute_group) | list)
              + [rebac_attribute_group_definition]
            }}
        status_code: 200

    - name: Create client '{{ client_name }}'
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          clientId: "{{ client_name }}"
          enabled: true
          publicClient: true
          standardFlowEnabled: true
          directAccessGrantsEnabled: true
          redirectUris:
            - "{{ frontend_url }}/auth/callback"
            - "{{ frontend_url }}/auth/silent-renew"
          webOrigins:
            - "{{ frontend_url }}"
          attributes:
            pkce.code.challenge.method: "S256"
            post.logout.redirect.uris: "{{ frontend_url }}"
        status_code: [201, 409]

    - name: Fetch client UUID for '{{ client_name }}'
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients?clientId={{ client_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: client_info

    - name: Configure client '{{ client_name }}'
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients/{{ client_info.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          clientId: "{{ client_name }}"
          enabled: true
          publicClient: true
          standardFlowEnabled: true
          directAccessGrantsEnabled: true
          redirectUris:
            - "{{ frontend_url }}/auth/callback"
            - "{{ frontend_url }}/auth/silent-renew"
          webOrigins:
            - "{{ frontend_url }}"
          attributes:
            pkce.code.challenge.method: "S256"
            post.logout.redirect.uris: "{{ frontend_url }}"
        status_code: 204

    - name: Create client roles
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients/{{ client_info.json[0].id }}/roles"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item }}"
        status_code: [201, 409]
      loop: "{{ client_roles }}"

    - name: Fetch existing client protocol mappers
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients/{{ client_info.json[0].id }}/protocol-mappers/models"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: existing_mappers

    - name: Create ReBAC attribute -> JWT claim protocol mappers
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients/{{ client_info.json[0].id }}/protocol-mappers/models"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item }}"
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            user.attribute: "{{ item }}"
            claim.name: "{{ item }}"
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        status_code: 201
      loop: "{{ rebac_attributes }}"
      # Re-running with an unchanged name would 400 rather than 409, unlike the other
      # create-if-missing tasks in this playbook — so skip explicitly instead.
      when: item not in (existing_mappers.json | map(attribute='name') | list)

    - name: Create test users (one per role)
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ item }}"
          email: "{{ item }}@cdrm.local"
          enabled: true
          emailVerified: true
          firstName: "{{ user_names[item].firstName }}"
          lastName: "{{ user_names[item].lastName }}"
        status_code: [201, 409]
      loop: "{{ client_roles }}"

    - name: Create ReBAC demo users (2 per attribute, restricted to one value each)
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ item.username }}"
          email: "{{ item.username }}@cdrm.local"
          enabled: true
          emailVerified: true
          firstName: "{{ item.firstName }}"
          lastName: "{{ item.lastName }}"
          attributes: "{{ item.attributes }}"
        status_code: [201, 409]
      loop: "{{ rebac_demo_users }}"

    - name: Fetch all realm users
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users?max=200"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: realm_users

    - name: Build username → UUID map
      set_fact:
        user_id_map: >-
          {{ dict(realm_users.json | map(attribute='username') | zip(realm_users.json | map(attribute='id'))) }}

    - name: Set test user names
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item] }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          firstName: "{{ user_names[item].firstName }}"
          lastName: "{{ user_names[item].lastName }}"
        status_code: 204
      loop: "{{ client_roles }}"

    - name: Set ReBAC demo user names, email and attributes
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item.username] }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          email: "{{ item.username }}@cdrm.local"
          emailVerified: true
          firstName: "{{ item.firstName }}"
          lastName: "{{ item.lastName }}"
          attributes: "{{ item.attributes }}"
        status_code: 204
      loop: "{{ rebac_demo_users }}"

    - name: Set test user passwords (non-temporary)
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item] }}/reset-password"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: password
          value: "{{ test_user_password }}"
          temporary: false
        status_code: 204
      loop: "{{ client_roles }}"

    - name: Set ReBAC demo user passwords (non-temporary)
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item.username] }}/reset-password"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: password
          value: "{{ test_user_password }}"
          temporary: false
        status_code: 204
      loop: "{{ rebac_demo_users }}"

    - name: Fetch all client roles
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/clients/{{ client_info.json[0].id }}/roles"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: all_roles

    - name: Build role name → representation map
      set_fact:
        role_map: >-
          {{ dict(all_roles.json | map(attribute='name') | zip(all_roles.json)) }}

    - name: Assign matching client role to each test user
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item] }}/role-mappings/clients/{{ client_info.json[0].id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ [role_map[item]] }}"
        status_code: 204
      loop: "{{ client_roles }}"

    - name: Assign matching client role to each ReBAC demo user
      uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ user_id_map[item.username] }}/role-mappings/clients/{{ client_info.json[0].id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ [role_map[item.role]] }}"
        status_code: 204
      loop: "{{ rebac_demo_users }}"
