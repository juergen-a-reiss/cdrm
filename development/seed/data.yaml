# kubernetes_context is the kubeconfig context name to deploy into — resolved against
# the backend's kubeconfig file (KUBECONFIG env var, default ~/.kube/config) at deploy
# time. "minikube" is what `minikube start` configures by default.
#
# All four stages share that single minikube cluster, so namespace_prefix keeps them
# from colliding: a workload with kubernetesNameSpace "platform" ends up as
# "dev-platform" in the development stage, "qa-platform" in qa, etc. Each cluster's
# k8s_namespaces below lists every resulting stage-prefixed namespace, one entry per
# namespace — seed.py creates them from this list (and deletes them on --reset), so it
# must stay in sync with the stages' namespace_prefix values and workloads'
# kubernetes_namespace values.
#
# Each k8s_namespaces entry controls its own GitOps management: use_git_ops: true (plus
# its own file_expression/yaml_expression — see the README's GitOps section for the
# placeholder/YAML-key-path grammar) makes seed.py add that namespace to the cluster's
# k8sGitOpsConfig.namespaces map (see seed.py's build_gitops_config()); an entry with no
# use_git_ops (or false) is left out of that map, so it keeps deploying via cdrm's direct
# Kubernetes patch instead of a git commit. gitops.use_git_ops/git_repo/git_branch below
# are the cluster-wide GitOps settings — git_branch is the default branch commits go to;
# an entry's own git_branch (see p-prod-platform/p-prod-website below) overrides it for
# just that namespace.
#
# git_repo points at the local Gitea instance (see development/argocd/README.md) —
# "localhost" because seed.py and cdrm's own bootRun process both run on the host;
# development/argocd/generate-applications.py substitutes host.minikube.internal for
# ArgoCD's own in-cluster Application manifests, since pods can't resolve "localhost" as
# the host machine.

clusters:
  # Only the paris pipeline's namespaces (the "p-" prefixed ones) are GitOps-managed;
  # frankfurt's "f-" namespaces are not. Production commits to its own "release" branch;
  # every other paris namespace uses the cluster-wide "main".
  - name: minikube
    description: "Local Minicube"
    cluster_type: "K8S"
    url: "http://127.0.0.1:1964/api/v1"
    gitops:
      use_git_ops: true
      git_repo: "http://localhost:3000/cdrm/gitops-demo.git"
      git_branch: "main"
    k8s_namespaces:
      - namespace: f-dev-platform
      - namespace: f-qa-platform
      - namespace: f-prod-platform
      - namespace: f-dev-website
      - namespace: f-qa-website
      - namespace: f-prod-website
      - namespace: p-qa-platform
        use_git_ops: true
        file_expression: "environments/{namespace}/{workload}.yaml"
        yaml_expression: "spec.template.spec.containers[0].image"
      - namespace: p-prod-platform
        use_git_ops: true
        file_expression: "environments/{namespace}/{workload}.yaml"
        yaml_expression: "spec.template.spec.containers[0].image"
        git_branch: "release"
      - namespace: p-qa-website
        use_git_ops: true
        file_expression: "environments/{namespace}/{workload}.yaml"
        yaml_expression: "spec.template.spec.containers[0].image"
      - namespace: p-prod-website
        use_git_ops: true
        file_expression: "environments/{namespace}/{workload}.yaml"
        yaml_expression: "spec.template.spec.containers[0].image"
        git_branch: "release"

stages:
  - name: ffm-development
    pipeline: frankfurt
    description: Development environment
    order: 1
    deployment_policy: IMMEDIATE
    kubernetes_context: minikube
    namespace_prefix: f-dev-
    clusters: [minikube]
  - name: ffm-qa
    pipeline: frankfurt
    description: Quality assurance environment
    order: 2
    deployment_policy: IMMEDIATE
    kubernetes_context: minikube
    namespace_prefix: f-qa-
    clusters: [minikube]
  - name: ffm-production
    pipeline: frankfurt
    description: Production environment
    order: 3
    deployment_policy: SCHEDULED
    kubernetes_context: minikube
    namespace_prefix: f-prod-
    clusters: [minikube]

  - name: paris-qa
    pipeline: paris
    description: Quality assurance environment
    order: 1
    deployment_policy: IMMEDIATE
    kubernetes_context: minikube
    namespace_prefix: p-qa-
    clusters: [minikube]
  - name: paris-production
    pipeline: paris
    description: Production environment
    order: 2
    deployment_policy: SCHEDULED
    kubernetes_context: minikube
    namespace_prefix: p-prod-
    clusters: [minikube]

products:
  # Purely organizational — groups a product listed later in this file must be listed
  # after their group (seed_products resolves product_group by name as it goes).
  - name: Core Products
    description: Top-level grouping for core platform and payment services
    is_group: true
  - name: Platform
    description: Core platform services
    product_group: Core Products
    stage_deployment_crons:
      - stage: ffm-production
        cron: "0 0 2 * * *"
  - name: Payments
    description: Payment processing services
    product_group: Core Products
    stage_deployment_crons:
      - stage: ffm-production
        cron: "0 0 3 * * *"
  - name: Mobile
    description: Mobile backend services
    # No production deployment time configured yet on purpose — demonstrates the
    # "release can't be promoted into an unconfigured SCHEDULED stage" behavior.

workloads:
  - name: platform-api
    product: Platform
    description: Platform API workload
    kubernetes: true
    kubernetes_kind: DEPLOYMENT
    kubernetes_namespace: platform
    pipeline: frankfurt  
  - name: platform-worker
    product: Platform
    description: Platform background worker workload
    kubernetes: true
    kubernetes_kind: DEPLOYMENT
    kubernetes_namespace: platform
    pipeline: frankfurt
  - name: payments-gateway
    product: Payments
    description: Payment gateway workload
    kubernetes: true
    kubernetes_kind: STATEFUL_SET
    kubernetes_namespace: website
    pipeline: frankfurt

  - name: platform-interface-emea
    product: Platform
    description: Platform interface
    kubernetes: true
    kubernetes_kind: DEPLOYMENT
    kubernetes_namespace: platform
    pipeline: paris
  - name: website-portal-france
    product: Payments
    description: Payment gateway workload
    kubernetes: true
    kubernetes_kind: DEPLOYMENT
    kubernetes_namespace: website
    pipeline: paris

  - name: payments-ledger
    product: Payments
    description: Payment ledger workload
    kubernetes: false
    pipeline: frankfurt
  - name: mobile-bff
    product: Mobile
    description: Mobile backend-for-frontend workload
    kubernetes: false
    pipeline: frankfurt

releases:
  - workload: platform-api
    image: nginx:1.30-alpine
    description: Initial release
  - workload: platform-interface-emea
    image: nginx:1.30-alpine
    description: Initial release 
  - workload: platform-worker
    image: nginx:1.30-alpine
    description: Initial release
  - workload: payments-gateway
    image: nginx:1.30-alpine
    description: Initial release
  - workload: payments-ledger
    image: nginx:1.30-alpine
    description: Initial release
  - workload: mobile-bff
    image: https://artifacts.example.com/mobile-bff/1.0.0/mobile-bff.tar.gz
    description: Initial release
