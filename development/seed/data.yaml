  # after their group (seed_products resolves product_group by name as it goes).

  # Level 1
  - name: core-saas-products-group
    description: Core SaaS Products
    is_group: true

  # Level 2
  - name: platform-group
    description: Platform Services. Everything that is needed to provide the client services.
    is_group: true
    product_group: core-saas-products-group
  - name: billing
    description: Billing Services.
    product_group: core-saas-products-group
    stage_deployment_crons:
      - stage: frankfurt-production
