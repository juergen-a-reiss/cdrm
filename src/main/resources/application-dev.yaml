spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cdrm
    username: cdrm
    password: cdrm
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:2305/realms/cdrm

cdrm:
  gitops:
    # Matches development/argocd/setup-gitops-repo.sh, which creates both of these
    # repos under the same local Gitea demo user — needed to push GitOps commits (see
    # GitCommitClient); anonymous read alone isn't enough. Two repos so the local setup
    # actually exercises a namespace overriding gitRepo away from its cluster's default
    # (see seed/data.yaml) rather than only ever having one repo to fall back to.
    repositories:
      - url: http://localhost:3000/cdrm/gitops-demo.git
        auth: BASIC
        username: cdrm
        password: cdrm
      - url: http://localhost:3000/cdrm/gitops-demo-2.git
        auth: BASIC
        username: cdrm
        password: cdrm
  notifications:
    kafka:
      # A single general-purpose topic, not release-specific — it carries every
      # entity's change events (release-history today, others as they're wired up) plus
      # WebSocket live-push relaying (KafkaChangeRelay), not just enterprise-integration
      # traffic. application.yaml has no default for this — production must choose its
      # own topic name explicitly. Local dev only, matching platform-dev-setup's Kafka
      # component.
      topic: cdrm
