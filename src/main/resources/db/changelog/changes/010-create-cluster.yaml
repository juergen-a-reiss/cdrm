databaseChangeLog:
  - changeSet:
      id: 010-create-cluster
      author: juergen
      changes:
        - createTable:
            tableName: cluster
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: url
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: varchar(24)
                  constraints:
                    nullable: false
              - column:
                  name: k8s_namespaces
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false
