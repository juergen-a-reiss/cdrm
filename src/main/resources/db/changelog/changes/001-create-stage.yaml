databaseChangeLog:
  - changeSet:
      id: 001-create-stage
      author: juergen
      changes:
        - createTable:
            tableName: stage
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: stage_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: kubernetes_context
                  type: varchar(255)
              - column:
                  name: namespace_prefix
                  type: varchar(100)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false
