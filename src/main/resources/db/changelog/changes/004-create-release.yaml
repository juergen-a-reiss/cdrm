databaseChangeLog:
  - changeSet:
      id: 004-create-release
      author: juergen
      changes:
        - createTable:
            tableName: release
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workload_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: current_stage_id
                  type: uuid
                  constraints:
                    nullable: false
              # Container image reference (not a URL) — e.g. "nginx:30" or
              # "my-registry.company.com/nginx:30" — as accepted by Kubernetes.
              - column:
                  name: image
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: workload_id
            constraintName: fk_release_workload
            referencedTableName: workload
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: current_stage_id
            constraintName: fk_release_current_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createTable:
            tableName: release_history
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              # No FK to release.id on purpose: history must survive release deletion.
              - column:
                  name: release_id
                  type: uuid
                  constraints:
                    nullable: false
              # Container image reference (not a URL) — same format as release.image.
              - column:
                  name: image
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: stage_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: pipeline
                  type: varchar(64)
              - column:
                  name: deployed_at
                  type: timestamp with time zone
              # Reason the most recent deploy attempt for this row failed (e.g. "cluster
              # not reachable"); cleared once it eventually succeeds. Null while still
              # unattempted (a SCHEDULED-policy row waiting for its cron time).
              - column:
                  name: deploy_error
                  type: text
              # No FK to workload.id/product.id on purpose: denormalized so by-workload/
              # by-product statistics keep working once a workload's releases (and then the
              # workload itself, and then its product) are deleted.
              - column:
                  name: workload_id
                  type: uuid
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              # product_name/workload_name/stage_name are a snapshot taken at insert time
              # (like image). Not a live lookup — so the UI can always display and
              # filter/sort on them even after the product/workload/stage that produced
              # this row has since been deleted.
              - column:
                  name: product_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: workload_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: stage_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(20)
                  defaultValue: PROMOTED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: release_history
            baseColumnNames: stage_id
            constraintName: fk_release_history_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createIndex:
            tableName: release
            columns:
              - column:
                  name: workload_id
            indexName: idx_release_workload_id
        - createIndex:
            tableName: release
            columns:
              - column:
                  name: current_stage_id
            indexName: idx_release_stage_id

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_pipeline_created_at
            columns:
              - column:
                  name: pipeline
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_product_id_created_at
            columns:
              - column:
                  name: product_id
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_workload_id_created_at
            columns:
              - column:
                  name: workload_id
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_action_created_at
            columns:
              - column:
                  name: action
              - column:
                  name: created_at

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_release_id_created_at
            columns:
              - column:
                  name: release_id
              - column:
                  name: created_at

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_stage_id_created_at
            columns:
              - column:
                  name: stage_id
              - column:
                  name: created_at

        # historyOverview() (the Release History dashboard) has no filter at all — every
        # row, ordered by created_at descending.
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_created_at
            columns:
              - column:
                  name: created_at
