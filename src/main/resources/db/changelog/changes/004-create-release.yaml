databaseChangeLog:
  - changeSet:
      id: 004-create-release
      author: juergen
      changes:
        - createTable:
            tableName: release
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workload_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: current_stage_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: binary_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: workload_id
            constraintName: fk_release_workload
            referencedTableName: workload
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: current_stage_id
            constraintName: fk_release_current_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createTable:
            tableName: release_history
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              # No FK to release.id on purpose: history must survive release deletion.
              - column:
                  name: release_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: binary_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: stage_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: deployed_at
                  type: timestamp with time zone
              # No FK to workload.id/product.id on purpose: denormalized so by-workload/
              # by-product statistics keep working once a workload's releases (and then the
              # workload itself, and then its product) are deleted.
              - column:
                  name: workload_id
                  type: uuid
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              # product_name/workload_name/stage_name are a snapshot taken at insert time
              # (like binary_url), not a live lookup — so the UI can always display and
              # filter/sort on them even after the product/workload/stage that produced
              # this row has since been deleted.
              - column:
                  name: product_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: workload_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: stage_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(20)
                  defaultValue: PROMOTED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: release_history
            baseColumnNames: stage_id
            constraintName: fk_release_history_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createIndex:
            tableName: release
            columns:
              - column:
                  name: workload_id
            indexName: idx_release_workload_id
        - createIndex:
            tableName: release
            columns:
              - column:
                  name: current_stage_id
            indexName: idx_release_stage_id
        - createIndex:
            tableName: release_history
            columns:
              - column:
                  name: release_id
            indexName: idx_release_history_release_id
        - createIndex:
            tableName: release_history
            columns:
              - column:
                  name: stage_id
            indexName: idx_release_history_stage_id
