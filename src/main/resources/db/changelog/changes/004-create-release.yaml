databaseChangeLog:
  - changeSet:
      id: 004-create-release
      author: juergen
      changes:
        - createTable:
            tableName: release
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workload_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: current_stage_id
                  type: uuid
                  constraints:
                    nullable: false
              # Container image reference (not a URL) — e.g. "nginx:30" or
              # "my-registry.company.com/nginx:30" — as accepted by Kubernetes.
              - column:
                  name: image
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: commit_id
                  type: varchar(64)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: workload_id
            constraintName: fk_release_workload
            referencedTableName: workload
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: current_stage_id
            constraintName: fk_release_current_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createTable:
            tableName: release_history
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              # No FK to release.id on purpose: history must survive release deletion.
              - column:
                  name: release_id
                  type: uuid
                  constraints:
                    nullable: false
              # Container image reference (not a URL) — same format as release.image.
              - column:
                  name: image
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: stage_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: pipeline
                  type: varchar(64)
              - column:
                  name: deployed_at
                  type: timestamp with time zone
              # Reason the most recent deploy attempt for this row failed (e.g. "cluster
              # not reachable"); cleared once it eventually succeeds. Null while still
              # unattempted (a SCHEDULED-policy row waiting for its cron time).
              - column:
                  name: deploy_error
                  type: text
              # When the async rollout-verification check concluded, success or failure.
              # Set immediately (= deployed_at) for non-Kubernetes workloads, since there's
              # nothing to verify; left null for a Kubernetes workload until the check
              # either confirms the rollout or the 5-minute grace period elapses.
              - column:
                  name: deployment_finished
                  type: timestamp with time zone
              # True once verification concludes the rollout did not succeed within the
              # grace period. A release can't be promoted while its current stage's latest
              # deployment is unfinished or failed — it can still be redeployed there.
              - column:
                  name: deployment_failed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Snapshotted at insert time (the resolver's answer can change later as
              # cluster config is edited) — whether this row's deploy went through
              # GitOps (see GitOpsResolver) rather than a direct Kubernetes patch. Drives
              # which columns the UI shows: gitops_error/gitops_retry_count only ever
              # apply when this is true; deploy_error is Kubernetes-rollout-side only.
              - column:
                  name: gitops_managed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Also snapshotted at insert time, alongside gitops_managed — whether the
              # workload was a Kubernetes workload. Used purely to decide whether the UI's
              # "Kubernetes Status" column applies at all (it's hidden, not computed, when
              # this is false) rather than to change any deployment behavior — that's
              # still workload.kubernetes, read live via WorkloadRepository.
              - column:
                  name: kubernetes_managed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Reason the most recent GitOps push attempt failed; cleared once it
              # succeeds. Distinct from deploy_error, which is the Kubernetes rollout's
              # own error — a GitOps push failure never touches deploy_error.
              - column:
                  name: gitops_error
                  type: text
              # Consecutive failed GitOps push attempts. Capped at 5 (see
              # DeploymentSchedulerJob) — on the 5th, the row is given up on
              # (deployment_failed/deployment_finished set) rather than retried forever,
              # since repeated git failures need a human to look at the repo/credentials.
              - column:
                  name: gitops_retry_count
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # First time the Kubernetes rollout verification observed the new image
              # actually running on a pod. The 5-minute rollout grace period is measured
              # from here, not from deployed_at — a GitOps deploy can sit unsynced for an
              # arbitrary time waiting on ArgoCD/a human without ever being reported as
              # failed; only a rollout that has visibly started and then stalls is.
              - column:
                  name: rollout_started_at
                  type: timestamp with time zone
              # Set when another deploy lands on this row's (workload, stage) while this
              # one is still awaiting cluster sync or mid-rollout (deployment_finished
              # still null) — superseding it instead of blocking the new deploy. Implies
              # deployment_finished is also set (to the same instant); deployment_failed
              # stays false, since being superseded isn't a failure of this deploy.
              - column:
                  name: replaced_at
                  type: timestamp with time zone
              # No FK to workload.id/product.id on purpose: denormalized so by-workload/
              # by-product statistics keep working once a workload's releases (and then the
              # workload itself, and then its product) are deleted.
              - column:
                  name: workload_id
                  type: uuid
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              # product_name/workload_name/stage_name are a snapshot taken at insert time
              # (like image). Not a live lookup — so the UI can always display and
              # filter/sort on them even after the product/workload/stage that produced
              # this row has since been deleted.
              - column:
                  name: product_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: workload_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: stage_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(20)
                  defaultValue: PROMOTED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: release_history
            baseColumnNames: stage_id
            constraintName: fk_release_history_stage
            referencedTableName: stage
            referencedColumnNames: id

        - createIndex:
            tableName: release
            columns:
              - column:
                  name: workload_id
            indexName: idx_release_workload_id
        - createIndex:
            tableName: release
            columns:
              - column:
                  name: current_stage_id
            indexName: idx_release_stage_id

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_pipeline_created_at
            columns:
              - column:
                  name: pipeline
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_product_id_created_at
            columns:
              - column:
                  name: product_id
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_workload_id_created_at
            columns:
              - column:
                  name: workload_id
              - column:
                  name: created_at
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_action_created_at
            columns:
              - column:
                  name: action
              - column:
                  name: created_at

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_release_id_created_at
            columns:
              - column:
                  name: release_id
              - column:
                  name: created_at

        - createIndex:
            tableName: release_history
            indexName: idx_release_history_stage_id_created_at
            columns:
              - column:
                  name: stage_id
              - column:
                  name: created_at

        # historyOverview() (the Release History dashboard) has no filter at all — every
        # row, ordered by created_at descending.
        - createIndex:
            tableName: release_history
            indexName: idx_release_history_created_at
            columns:
              - column:
                  name: created_at
