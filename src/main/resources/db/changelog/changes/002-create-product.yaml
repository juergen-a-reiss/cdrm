databaseChangeLog:
  - changeSet:
      id: 002-create-product
      author: juergen
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: is_group
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Self-reference to the parent product group. A product group is just an
              # organizational aid for humans (see is_group) — never a deployment target —
              # so deleting a group ungroups its members rather than cascading the delete.
              - column:
                  name: product_group_id
                  type: uuid
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: product_group_id
            constraintName: fk_product_product_group
            referencedTableName: product
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: product
            columns:
              - column:
                  name: product_group_id
            indexName: idx_product_product_group_id

        - createTable:
            tableName: product_stage
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: stage_id
                  type: uuid
                  constraints:
                    nullable: false
              # Only rows for stages a product has actually configured a time for — sparse,
              # like workload_stage. No configured row = releases can't promote into that
              # stage for that product while its policy is SCHEDULED.
              - column:
                  name: deployment_cron
                  type: varchar(120)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: product_stage
            columnNames: product_id, stage_id
            constraintName: uq_product_stage
        - addForeignKeyConstraint:
            baseTableName: product_stage
            baseColumnNames: product_id
            constraintName: fk_product_stage_product
            referencedTableName: product
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: product_stage
            baseColumnNames: stage_id
            constraintName: fk_product_stage_stage
            referencedTableName: stage
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            tableName: product_stage
            columns:
              - column:
                  name: product_id
            indexName: idx_product_stage_product_id
        - createIndex:
            tableName: product_stage
            columns:
              - column:
                  name: stage_id
            indexName: idx_product_stage_stage_id

