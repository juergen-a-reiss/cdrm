databaseChangeLog:
  - changeSet:
      id: 007-add-release-current-stage
      author: juergen
      changes:
        - addColumn:
            tableName: release
            columns:
              - column:
                  name: current_stage_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: release
            baseColumnNames: current_stage_id
            constraintName: fk_release_current_stage
            referencedTableName: stage
            referencedColumnNames: id
